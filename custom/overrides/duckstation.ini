; Voci di settings.ini di DuckStation diverse da RetroDECK:
;   [Sezione]
;   Chiave = Valore
; Esempio:
;   [Display]
;   AspectRatio = 16:9
; Non mettere qui i percorsi ([BIOS], [MemoryCards], [Folders]): li gestisce lo script.

; Niente finestra console accanto al gioco (RetroDECK la usa su Linux, dove non si vede)
[Logging]
LogToConsole = false

; Solo SDL per i controller: con anche XInput lo stesso pad compare due volte
; (XInput-N e SDL-N). SDL legge comunque i pad XInput.
[InputSources]
XInput = false

; Immagine 4:3 come sul televisore. Ritaglio solo dell'overscan (la parte che
; anche il televisore nascondeva): tagliando tutti i bordi l'immagine va
; ingrandita di piu' e risulta meno nitida. Ingrandimento finale a pixel netti
; (RetroDECK usa BilinearSmooth, che sui monitor grandi sfuma l'immagine);
; i filmati (24 bit) restano sfumati.
[Display]
AspectRatio = 4:3
CropMode = Overscan
Scaling = Nearest
Scaling24Bit = BilinearSmooth

; Risoluzione interna 6x (RetroDECK: 3x): sui monitor 1440p e' l'altezza dello
; schermo. PGXP corregge la geometria 3D tremolante; sprite con filtro nitido.
[GPU]
ResolutionScale = 6
PGXPEnable = true
SpriteTextureFilter = SharpBilinear
